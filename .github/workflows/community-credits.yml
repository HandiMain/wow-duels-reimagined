name: Community credits

# Source of truth: closed verified bug reports, merged PRs, and curated names.
# Issue/PR/schedule triggers are effective after this workflow is approved on
# the default branch. It always updates develop, never main.
on:
  push:
    branches: [develop]
    paths:
      # Every addon subsystem change must run Lua + contract regression
      # checks; no hand-maintained partial list of individual Lua files.
      - addon/DuelsReimagined/**
      - community/credits.json
      - tools/community/**
      - .github/workflows/community-credits.yml
  issues:
    types: [closed, reopened, labeled, unlabeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: duels-community-credits
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'HandiMain/wow-duels-reimagined' &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
          fetch-depth: 1

      - name: Finalize approved Options artwork (single migration)
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          p = Path("addon/DuelsReimagined/Media/Skin/DuelOptionsCategoryArt.png")
          raw = p.read_bytes()
          def sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + bytes([0]) + data).hexdigest()
          old = "591e3c3dc997b2eafc27c50a342d727ecd29fd06"
          new = "f0b185f860d73d94ab44cdad41328bf2313ec7ba"
          if sha(raw) == old:
              b64 = base64.b64encode(raw).decode()
              marker = "IDrwP8B"
              pos = b64.index(marker)
              left = pos
              while b64[left - 1] == "A":
                  left -= 1
              assert pos - left == 118, "Unexpected source atlas contents"
              raw = base64.b64decode(b64[:pos] + "A"*8 + b64[pos:])
              assert len(raw) == 4832 and sha(raw) == new, "Asset recovery digest mismatch"
              p.write_bytes(raw)
          else:
              assert sha(raw) == new, "Unknown Options artwork state"
          print("Approved screenshot asset SHA:", sha(raw))
          PY

      - name: Parse every addon Lua file (syntax only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find addon/DuelsReimagined -name '*.lua' -type f -print0 | xargs -0 -r -n 1 luac5.1 -p

      - name: Execute Search and SavedVariables runtime contracts (Lua 5.1)
        run: lua5.1 tools/community/check_runtime.lua

      - name: Check generator and UI contracts without network
        run: python3 -m unittest discover -s tools/community -p 'test_*.py' -v

      - name: Refresh verified credits from GitHub
        env:
          GITHUB_REPOSITORY: HandiMain/wow-duels-reimagined
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/community/generate_credits.py

      - name: Commit approved artwork migration and verified credits
        run: |
          git add -- addon/DuelsReimagined/Community/Credits.lua addon/DuelsReimagined/Media/Skin/DuelOptionsCategoryArt.png
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize approved Options artwork and verified credits'
          git push origin HEAD:develop
